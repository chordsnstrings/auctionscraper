#cloud-config
# Ecosine auction screen — droplet provisioning.
#
# Fully declarative: the provisioning environment has no inbound path to this
# host (SSH is filtered, and port 80 to arbitrary IPs is blocked by an
# intercepting egress proxy), so this file is the entire build and the droplet
# reports outward rather than being polled.
#
# That constraint produced a better shape than the one it replaced: there is no
# control API listening, nothing inbound is exposed, and the firewall allows
# only SSH from the account's own keys.
#
# The NTFY, BRANCH and SRC_B64 placeholders below are substituted by
# deploy/provision.sh — written without their underscores here so the
# substitution does not also fire on this comment.
# Target: s-1vcpu-1gb, $6/mo.

timezone: Asia/Dubai
package_update: true
package_upgrade: false

packages: [git, curl, ca-certificates, bzip2, ufw]

write_files:
  - path: /opt/ecosine/src.tbz2
    permissions: '0600'
    encoding: b64
    content: __SRC_B64__

  - path: /opt/ecosine/report.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Outbound-only status channel. Random topic, non-secret payloads only.
      curl -sS -m 20 -H "Title: $1" -d "$2" "https://ntfy.sh/__NTFY__" >/dev/null 2>&1 || true
      echo "[$(date -Is)] $1 :: $2" >> /opt/ecosine/logs/provision.log

  - path: /opt/ecosine/app/.env
    permissions: '0600'
    content: |
      # Vision and SMTP are unset until real credentials are supplied.
      # The screen still runs: every lot falls through to INSPECT with no
      # ceiling, and the digest is written to disk instead of emailed.
      VISION_ENABLED=false
      DIGEST_DRY_RUN=true

  - path: /opt/ecosine/update.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Pull, reinstall, report. No-op until a deploy key is registered.
      set -euo pipefail
      cd /opt/ecosine/app
      [ -d .git ] || exit 0
      before=$(git rev-parse HEAD 2>/dev/null || echo none)
      git fetch --quiet origin __BRANCH__ || exit 0
      git reset --hard --quiet "origin/__BRANCH__"
      after=$(git rev-parse HEAD)
      [ "$before" = "$after" ] && exit 0
      npm install --no-audit --no-fund
      /opt/ecosine/report.sh "updated" "$before -> $after"

  - path: /etc/systemd/system/ecosine-run.service
    content: |
      [Unit]
      Description=Ecosine daily auction screen
      After=network-online.target
      [Service]
      Type=oneshot
      WorkingDirectory=/opt/ecosine/app
      EnvironmentFile=-/opt/ecosine/app/.env
      ExecStart=/bin/bash -lc 'npm run run >> /opt/ecosine/logs/run.log 2>&1; c=$?; /opt/ecosine/report.sh "daily-run" "exit=$c $(tail -c 400 /opt/ecosine/logs/run.log | tr "\\n" " ")"'
      TimeoutStartSec=5400
      Nice=5

  - path: /etc/systemd/system/ecosine-run.timer
    content: |
      [Unit]
      Description=Ecosine daily screen, 06:00 Gulf
      [Timer]
      OnCalendar=*-*-* 06:00:00
      Persistent=true
      RandomizedDelaySec=300
      [Install]
      WantedBy=timers.target

  - path: /etc/systemd/system/ecosine-update.service
    content: |
      [Unit]
      Description=Ecosine self-update from git
      [Service]
      Type=oneshot
      ExecStart=/opt/ecosine/update.sh

  - path: /etc/systemd/system/ecosine-update.timer
    content: |
      [Unit]
      Description=Poll git for new commits
      [Timer]
      OnBootSec=5min
      OnUnitActiveSec=5min
      [Install]
      WantedBy=timers.target

runcmd:
  - [bash, -lc, "mkdir -p /opt/ecosine/{app/data,logs}"]
  - [bash, -lc, "/opt/ecosine/report.sh 'boot' \"$(hostname) $(curl -s -m5 ifconfig.me || echo ?) ubuntu $(lsb_release -rs 2>/dev/null)\""]

  # 1 GB of RAM against a Chromium peak near 865 MB. Swap is what keeps the
  # nightly run from being chosen by the OOM killer.
  - [bash, -lc, "fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab && sysctl -w vm.swappiness=10"]

  - [bash, -lc, "curl -fsSL https://deb.nodesource.com/setup_22.x | bash - >/dev/null 2>&1 && apt-get install -y nodejs >/dev/null 2>&1; /opt/ecosine/report.sh 'node' \"$(node -v) npm $(npm -v)\""]

  - [bash, -lc, "cd /opt/ecosine/app && tar xjf /opt/ecosine/src.tbz2 && rm -f /opt/ecosine/src.tbz2 && /opt/ecosine/report.sh 'source' \"$(find . -name '*.ts' | wc -l) ts files\""]

  - [bash, -lc, "cd /opt/ecosine/app && npm install --no-audit --no-fund >/opt/ecosine/logs/npm.log 2>&1; /opt/ecosine/report.sh 'npm-install' \"exit=$? $(tail -c 200 /opt/ecosine/logs/npm.log | tr '\\n' ' ')\""]

  - [bash, -lc, "cd /opt/ecosine/app && npx playwright install --with-deps chromium >/opt/ecosine/logs/pw.log 2>&1; /opt/ecosine/report.sh 'chromium' \"exit=$? $(tail -c 200 /opt/ecosine/logs/pw.log | tr '\\n' ' ')\""]

  # Deploy key for the private repo. Generated here so the private half never
  # crosses a network; the public half is reported for pasting into the repo's
  # Deploy keys page, after which ecosine-update.timer takes over.
  - [bash, -lc, "ssh-keygen -t ed25519 -N '' -C 'ecosine-droplet' -f /opt/ecosine/deploy_key >/dev/null 2>&1; install -d -m700 /root/.ssh; printf 'Host github.com\\n  IdentityFile /opt/ecosine/deploy_key\\n  IdentitiesOnly yes\\n  StrictHostKeyChecking accept-new\\n' > /root/.ssh/config; /opt/ecosine/report.sh 'deploy-key' \"$(cat /opt/ecosine/deploy_key.pub)\""]

  # The decisive test: can this IP get past Cloudflare at all?
  - [bash, -lc, "cd /opt/ecosine/app && (npm run preflight > /opt/ecosine/logs/preflight.log 2>&1; echo $? > /opt/ecosine/logs/preflight.code); /opt/ecosine/report.sh 'preflight' \"exit=$(cat /opt/ecosine/logs/preflight.code) $(grep -aoE '(browser . site|plain fetch . (sitemap|api)|sqlite|vision|smtp)[^\\n]{0,70}' /opt/ecosine/logs/preflight.log | tr '\\n' '|')\""]

  - [bash, -lc, "ufw allow 22/tcp >/dev/null && ufw --force enable >/dev/null; systemctl daemon-reload && systemctl enable --now ecosine-run.timer ecosine-update.timer >/dev/null 2>&1; /opt/ecosine/report.sh 'ready' \"timers: $(systemctl list-timers --no-pager | grep -c ecosine) armed; next run $(systemctl show ecosine-run.timer -p NextElapseUSecRealtime --value)\""]
